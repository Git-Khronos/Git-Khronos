[workspace]
members = ["crates/git-core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"

[workspace.dependencies]
git-chronos-git-core = { path = "crates/git-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
