[workspace]
members = ["crates/git-core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"

[workspace.dependencies]
git-khronos-git-core = { path = "crates/git-core" }
gix = { version = "0.90", default-features = false, features = ["sha1", "max-performance"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
