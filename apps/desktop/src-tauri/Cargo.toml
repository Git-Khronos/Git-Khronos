[package]
name = "git-khronos-desktop"
default-run = "git-khronos"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Git Khronos desktop application"
authors = ["Maurizio Casciano <mauriziocasciano7@gmail.com>"]
homepage = "https://github.com/Git-Khronos/Git-Khronos"
repository = "https://github.com/Git-Khronos/Git-Khronos.git"

[[bin]]
name = "git-khronos"
path = "src/main.rs"

[lib]
name = "git_khronos_desktop"
# Desktop entry points link this crate from Rust; no foreign-language library is shipped.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git-khronos-git-core.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-dialog = "=2.8.4"
portable-pty = "0.9.0"
notify = "8.2.0"
getrandom = "=0.3.4"
tokio = { version = "=1.53.3", default-features = false, features = ["process", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = { version = "2.0.2", features = ["v2_20"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
semver = "=1.0.28"
tempfile = "=3.27.0"

[dev-dependencies]
tauri = { version = "=2.12.7", features = ["test"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.3.0"
sha2 = "=0.10.9"
