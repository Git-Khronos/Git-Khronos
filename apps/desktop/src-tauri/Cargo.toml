[package]
name = "git-chronos-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Git Chronos desktop application"
authors = ["Maurizio Casciano <mauriziocasciano7@gmail.com>"]
homepage = "https://github.com/Git-Chronos/Git-Chronos"
repository = "https://github.com/Git-Chronos/Git-Chronos.git"

[lib]
name = "git_chronos_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
git-chronos-git-core.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
notify = "8.2.0"

[dev-dependencies]
serde_json.workspace = true
