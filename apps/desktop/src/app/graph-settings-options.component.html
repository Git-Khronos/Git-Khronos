@let settings = model();
<div class="column-settings-scroll">
  <strong>Layout</strong>
  <button class="fit-graph-column" type="button" (click)="settings.fitGraphColumnToBranches($event)"><gc-icon name="maximize" [size]="12" /><span>Fit all {{ settings.graphRequiredLaneCount() }} branch {{ settings.graphRequiredLaneCount() === 1 ? 'path' : 'paths' }}<small>{{ settings.graphMaximumWidth() }} px</small></span></button>
  <label><input type="checkbox" [checked]="settings.compactGraphColumn()" (change)="settings.setCompactGraphColumn($any($event.target).checked)" /> Compact Graph Column</label>
  <label><input type="checkbox" [checked]="settings.showGraphScrollMarkers()" (change)="settings.setGraphScrollMarkers($any($event.target).checked)" /> Scroll Markers</label>
  <label title="When off, widening a column narrows the others so the history always fits the panel"><input type="checkbox" [checked]="settings.graphHorizontalScroll()" (change)="settings.setGraphHorizontalScroll($any($event.target).checked)" /> Horizontal Scrolling</label>
  <i class="settings-divider"></i>
  <strong>Branch visibility</strong>
  <label><input type="checkbox" [checked]="settings.smartBranchVisibility()" (change)="settings.setSmartBranchVisibility($any($event.target).checked)" /> Smart Branch Visibility</label>
  <label title="Include Copilot checkpoint references and their history"><input #checkpointVisibility type="checkbox" [checked]="settings.checkpointsVisible()" [disabled]="settings.checkpointsBusy()" (change)="settings.setCheckpointVisibility(checkpointVisibility.checked, checkpointVisibility)" /> Show Copilot checkpoints</label>
  <i class="settings-divider"></i>
  <strong>Columns</strong>
  @for (column of settings.graphColumnOrder(); track column) {
    <div class="column-setting-row">
      <label><input type="checkbox" [checked]="settings.graphColumnVisible(column)" (change)="settings.setGraphColumn(column, $any($event.target).checked)" /> {{ settings.graphColumnLabels[column] }}</label>
      <span class="column-reorder-actions" role="group" [attr.aria-label]="'Reorder ' + settings.graphColumnLabels[column] + ' column'">
        <button type="button" [disabled]="settings.graphColumnOrderIndex(column) === 0" [attr.aria-label]="'Move ' + settings.graphColumnLabels[column] + ' column left'" [title]="'Move ' + settings.graphColumnLabels[column] + ' column left'" (click)="settings.moveGraphColumn(column, -1)"><gc-icon name="chevron-left" [size]="11" /></button>
        <button type="button" [disabled]="settings.graphColumnOrderIndex(column) === settings.graphColumnOrder().length - 1" [attr.aria-label]="'Move ' + settings.graphColumnLabels[column] + ' column right'" [title]="'Move ' + settings.graphColumnLabels[column] + ' column right'" (click)="settings.moveGraphColumn(column, 1)"><gc-icon name="chevron-right" [size]="11" /></button>
      </span>
    </div>
  }
  <small class="column-settings-hint">Drag headers or use the arrow buttons to reorder columns.</small>
</div>
<footer class="column-settings-footer">
  <button class="restore-graph-defaults" type="button" (click)="settings.restoreGraphDefaults()"><gc-icon name="reset" [size]="11" />Restore graph defaults</button>
</footer>
