<header><span><gc-icon name="branch" [size]="15" /></span><div><small>Bring {{ source() }} into {{ target() }}</small><strong>{{ source() }} → {{ target() }}</strong></div></header>
@if (advice(); as advice) { <p class="branch-drop-advice" role="status">{{ advice.text }}</p> }
<button type="button" role="menuitem" [disabled]="busy()" (click)="strategy.emit('ff-only')"><gc-icon name="merge" [size]="14" /><span><strong>Fast-forward {{ target() }} @if (advice()?.recommended === 'ff-only') { <em class="drop-badge">Recommended</em> }</strong><small>{{ advice()?.fastForwardBlocked ? 'Not possible: ' + target() + ' has its own commits' : 'Move ' + target() + ' forward to ' + source() + ' without a new commit' }}</small></span></button>
<button type="button" role="menuitem" [disabled]="busy()" (click)="strategy.emit('merge')"><gc-icon name="merge" [size]="14" /><span><strong>Merge {{ source() }} into {{ target() }} @if (advice()?.recommended === 'merge') { <em class="drop-badge">Recommended</em> }</strong><small>Add a merge commit; keeps both histories as they are</small></span></button>
<button type="button" role="menuitem" [disabled]="busy()" (click)="strategy.emit('squash')"><gc-icon name="git-commit" [size]="14" /><span><strong>Squash {{ source() }} into {{ target() }}</strong><small>Stage all changes as one new commit you write</small></span></button>
<button type="button" role="menuitem" [disabled]="busy()" (click)="strategy.emit('rebase')"><gc-icon name="refresh" [size]="14" /><span><strong>Rebase {{ source() }} onto {{ target() }}</strong><small>Replay {{ source() }}'s commits on top; they get new IDs</small></span></button>
<button type="button" role="menuitem" [disabled]="busy()" (click)="interactive.emit()"><gc-icon name="edit" [size]="14" /><span><strong>Interactive Rebase</strong><small>Reorder, reword, combine, or drop source commits</small></span></button>
<footer><button type="button" class="drop-compare" [disabled]="busy()" (click)="compare.emit()">Compare and choose…</button><button type="button" (click)="cancel.emit()">Cancel</button></footer>
