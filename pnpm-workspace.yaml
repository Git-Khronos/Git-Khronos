packages:
  - apps/*
  - libs/*

# Same-major security fixes for exact upstream pins in Nx/Angular tooling.
# Remove each override when its parent adopts a patched dependency version.
overrides:
  'axios@>=1.0.0 <1.20.0': 1.20.0
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'follow-redirects@>=1.0.0 <1.16.1': 1.16.1
  'smol-toml@>=1.0.0 <1.9.0': 1.9.0
  'vite@>=8.0.0 <8.3.3': 8.3.3
  'zod@>=4.0.0 <4.6.6': 4.6.6

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
