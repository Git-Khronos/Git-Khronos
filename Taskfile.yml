version: '3'

vars:
  TAURI_CONFIG: apps/desktop/src-tauri/tauri.conf.json
  CARGO_OUTPUT: '{{.CARGO_TARGET_DIR | default "target"}}'
  RELEASE_BINARY: '{{if eq OS "windows"}}target\release\git-khronos.exe{{else}}./target/release/git-khronos{{end}}'

tasks:
  default:
    desc: List the available Git Khronos tasks
    cmds:
      - task --list

  doctor:
    desc: Verify the local Node, pnpm, Rust, and Git toolchains
    cmds:
      - node tools/check-node.mjs
      - pnpm --version
      - rustc --version
      - git --version

  install:
    desc: Install the pinned frontend dependencies
    deps: [doctor]
    cmds:
      - pnpm install --frozen-lockfile

  dev:
    aliases: [start]
    desc: Start the Tauri app in development mode with live reload
    deps: [doctor]
    cmds:
      - pnpm dev

  frontend:
    desc: Build only the Angular frontend
    deps: [doctor]
    cmds:
      - pnpm build

  preview:
    desc: Serve the sample-data browser preview at http://127.0.0.1:4200
    deps: [doctor]
    cmds:
      - pnpm exec ng serve desktop --host 127.0.0.1 --port 4200

  build:
    desc: Build the optimized native executable without installer packages
    deps: [doctor]
    cmds:
      - pnpm exec tauri build --no-bundle --config {{.TAURI_CONFIG}}

  run:
    desc: Build if needed, then run the optimized native executable
    deps: [build]
    cmds:
      - '{{.RELEASE_BINARY}}'

  bundle:
    desc: Build the native executable and platform installer packages
    deps: [doctor]
    cmds:
      - pnpm tauri:build

  package:deb:
    aliases: [deb]
    desc: Build the Debian/Ubuntu system package
    platforms: [linux]
    deps: [doctor]
    cmds:
      - task: package:deb:build
      - tools/manage-linux-package.sh verify

  package:deb:build:
    internal: true
    platforms: [linux]
    method: checksum
    sources: &debian_build_sources
      - Taskfile.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - angular.json
      - nx.json
      - tsconfig*.json
      - .cargo/**/*
      - apps/desktop/**/*
      - exclude: apps/desktop/src-tauri/gen/**/*
      - exclude: apps/desktop/src-tauri/target/**/*
      - crates/**/*
      - libs/**/*
      - packaging/**/*
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - tools/check-node.mjs
      - tools/check-production-renderer.mjs
      - tools/report-initial-renderer.mjs
      - tools/prepare-linux-package.mjs
      - tools/prepare-rust-notices.mjs
      - tools/prepare-frontend-notices.mjs
      - tools/collect-rust-notices.mjs
      - tools/manage-linux-package.sh
      - tools/build-linux-package.sh
      - tools/check-linux-package-watcher.mjs
      - tools/cli-entry.mjs
      - tools/package-build-receipt.mjs
      - tools/check-linux-abi.mjs
      - tools/require-ubuntu-jammy.sh
    generates: &debian_build_outputs
      - '{{.CARGO_OUTPUT}}/release/git-khronos'
      - '{{.CARGO_OUTPUT}}/release/.git-khronos-package-build.v1.json'
      - '{{.CARGO_OUTPUT}}/release/bundle/deb/*.deb'
      - target/package-assets/changelog.gz
      - target/package-assets/git-khronos.1.gz
      - target/package-assets/rust-dependency-notices.json.gz
      - target/package-assets/frontend-dependency-notices.txt.gz
      - dist/apps/desktop/3rdpartylicenses.txt
      - dist/apps/desktop/browser/index.html
    status:
      - node tools/package-build-receipt.mjs check "{{.CHECKSUM}}" >/dev/null 2>&1
    cmds:
      - bash tools/build-linux-package.sh local "{{.CHECKSUM}}" "{{.TAURI_CONFIG}}"

  package:ubuntu:
    desc: Build the Ubuntu 22.04 amd64 release package and record its checked outputs
    platforms: [linux]
    cmds:
      - bash tools/require-ubuntu-jammy.sh
      - task: package:ubuntu:build

  package:ubuntu:build:
    internal: true
    platforms: [linux]
    method: checksum
    sources: *debian_build_sources
    generates: *debian_build_outputs
    status:
      - node tools/package-build-receipt.mjs check "ubuntu-jammy:{{.CHECKSUM}}" >/dev/null 2>&1
    cmds:
      - bash tools/build-linux-package.sh ubuntu-jammy "ubuntu-jammy:{{.CHECKSUM}}" "{{.TAURI_CONFIG}}"

  package:appimage:
    aliases: [package:appimage:path]
    desc: Build an executable AppImage on the Ubuntu 22.04 amd64 compatibility baseline
    platforms: [linux]
    cmds:
      - bash tools/require-ubuntu-jammy.sh
      - task: package:appimage:build

  package:appimage:build:
    internal: true
    platforms: [linux]
    method: none
    cmds:
      - bash tools/build-linux-package.sh ubuntu-jammy-appimage appimage-jammy:uncached "{{.TAURI_CONFIG}}"

  package:deb:path:
    desc: Print the latest Debian/Ubuntu package path
    platforms: [linux]
    cmds:
      - tools/manage-linux-package.sh print-package

  install:system:
    aliases: [install:linux]
    desc: Build and install Git Khronos system-wide on Debian/Ubuntu
    platforms: [linux]
    cmds:
      - >-
        {{if .CLI_ARGS}}
        printf '%s\n' 'task install:linux takes no archive argument. Use install:linux:dry-run or install:linux:status to inspect a selected archive.' >&2; exit 2
        {{else}}
        task package:deb && tools/manage-linux-package.sh install
        {{end}}

  install:system:dry-run:
    aliases: [install:linux:dry-run]
    desc: Preview APT installation of the local build or an explicitly selected Debian package
    platforms: [linux]
    cmds:
      - "{{if .CLI_ARGS}}tools/manage-linux-package.sh simulate-install {{.CLI_ARGS}}{{else}}task package:deb && tools/manage-linux-package.sh simulate-install{{end}}"

  install:system:preview:
    aliases: [install:linux:preview]
    desc: Open a reviewed Debian archive with a temporary profile, without installing
    platforms: [linux]
    cmds:
      - "bash tools/preview-linux-package.sh {{.CLI_ARGS}}"

  install:system:status:
    aliases: [install:linux:status]
    desc: Compare the installed executable and launcher with the latest or explicitly selected Debian package
    platforms: [linux]
    cmds:
      - tools/manage-linux-package.sh installed-status{{if .CLI_ARGS}} {{.CLI_ARGS}}{{end}}

  uninstall:system:
    aliases: [uninstall:linux]
    desc: Remove the system-wide Debian/Ubuntu installation
    platforms: [linux]
    cmds:
      - tools/manage-linux-package.sh uninstall

  test:
    desc: Run the workspace test suite
    deps: [doctor]
    cmds:
      - pnpm test

  test:e2e:
    desc: Run deterministic browser-renderer journeys against sample data
    deps: [doctor]
    cmds:
      - pnpm nx run desktop:e2e{{if .CLI_ARGS}} -- {{.CLI_ARGS}}{{end}}

  test:e2e:install:
    desc: Install the Chromium runtime used by renderer end-to-end tests
    deps: [doctor]
    cmds:
      - pnpm exec playwright install chromium

  check:
    desc: Run frontend compilation, Rust checks, and Clippy
    deps: [doctor]
    cmds:
      - pnpm check

  fmt:
    desc: Format all Rust sources
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Verify Rust formatting without modifying files
    cmds:
      - cargo fmt --all -- --check

  ci:
    desc: Run the local continuous-integration checks
    cmds:
      - task: fmt:check
      - task: check
      - task: test

  clean:
    desc: Remove generated Nx, Angular, Rust, and distribution artifacts
    cmds:
      - pnpm exec nx reset
      - cargo clean
