name: Desktop CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      native-suite:
        description: Packaged native suite
        required: true
        default: full
        type: choice
        options:
          - full
          - performance

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"
  NX_ISOLATE_PLUGINS: "false"

jobs:
  windows-repository-files:
    name: Windows repository file boundaries
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NX_DAEMON: "false"
      NX_ISOLATE_PLUGINS: "false"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-repository-files-v1
      - run: pnpm install --frozen-lockfile
      - name: Verify repository file boundaries on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core repository_files::tests -- --nocapture
      - name: Verify working-file previews on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core file_content::tests -- --nocapture
      - name: Verify ignore-rule scope on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core untracks_only_the_selected_file_and_preserves_other_changes -- --nocapture
      - name: Verify ignore-file safety on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core tests::ignore_ -- --nocapture
      - name: Verify discard path boundaries on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core discard_refuses_a_parent_symlink_swapped_after_review -- --nocapture

  linux-checks:
    name: Linux TypeScript, Rust and harness checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: checks-line-tables-v1
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf git-lfs openssh-client gnupg gpgsm openssl
      - run: pnpm install --frozen-lockfile
      - name: Verify generated IPC, TypeScript, Rust, and harness tests
        run: |
          mkdir -p "$RUNNER_TEMP/git-khronos-tests"
          df -h . "$RUNNER_TEMP"
          pnpm nx run-many -t check -p contracts desktop --output-style=static
          TMPDIR="$RUNNER_TEMP/git-khronos-tests" pnpm nx run desktop:test --output-style=static
          TMPDIR="$RUNNER_TEMP/git-khronos-tests" pnpm nx run desktop:test-lfs --output-style=static
          TMPDIR=/tmp pnpm nx run desktop:test-signing --output-style=static
          pnpm nx run desktop:native-harness-test --output-style=static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checks-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  renderer:
    name: Renderer acceptance (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the renderer acceptance shard
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          GIT_KHRONOS_RENDERER_OUTPUT_DIR: test-results/renderer/shard-${{ matrix.shard }}
          GIT_KHRONOS_RENDERER_REPORT_DIR: test-results/renderer-report/shard-${{ matrix.shard }}
        run: |
          pnpm nx run desktop:e2e --output-style=static --skipNxCache -- \
            --shard="$SHARD/$SHARD_TOTAL" --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: renderer-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  checks:
    # Preserve the existing check name even when callers require it in rulesets.
    name: Checks and renderer acceptance
    needs: [linux-checks, renderer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful checks and all Chromium shards
        env:
          CHECKS_RESULT: ${{ needs.linux-checks.result }}
          RENDERER_RESULT: ${{ needs.renderer.result }}
        run: |
          printf 'Linux checks: %s\nRenderer matrix: %s\n' "$CHECKS_RESULT" "$RENDERER_RESULT"
          test "$CHECKS_RESULT" = success && test "$RENDERER_RESULT" = success

  packaged-native:
    name: Jammy package and native acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NATIVE_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || (github.event_name == 'workflow_dispatch' && inputs['native-suite'] || 'full') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/jammy-git
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: packaged-jammy-v1
      - uses: go-task/setup-task@v1
      - name: Install Linux package and WebDriver prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb libxtst6 git-lfs openssh-client openssh-server fakeroot desktop-file-utils libglib2.0-bin openssl dbus
          for tool in WebKitWebDriver dbus-daemon dbus-send dbus-run-session; do
            command -v "$tool"
          done
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Tauri WebDriver bridge
        run: cargo install tauri-driver --locked --version 2.0.6
      - name: Run packaging regressions
        run: |
          # Private dpkg databases still read host invocation hooks. Keep the
          # runner's known hooks out of fixture transactions and restore them
          # before building or installing the application package.
          hooks=(needrestart pkg-config-hook-config pkgconf-hook-config)
          backup=$(mktemp -d)
          restore_hook() {
            status=$?
            for hook in "${hooks[@]}"; do
              if [ -e "$backup/$hook" ]; then
                sudo mv -- "$backup/$hook" "/etc/dpkg/dpkg.cfg.d/$hook" || status=1
              fi
            done
            rmdir -- "$backup" || status=1
            exit "$status"
          }
          trap restore_hook EXIT
          for hook in "${hooks[@]}"; do
            if [ -e "/etc/dpkg/dpkg.cfg.d/$hook" ]; then
              sudo mv -- "/etc/dpkg/dpkg.cfg.d/$hook" "$backup/$hook"
            fi
          done
          pnpm nx run desktop:package-test --output-style=static
      - name: Build and verify Debian package
        id: package
        run: |
          pnpm nx run desktop:package-ubuntu --output-style=static
          echo "path=$(task --silent package:deb:path)" >> "$GITHUB_OUTPUT"
      - name: Gate the release ABI and capture one immutable runtime-test artifact
        run: |
          package=$(task --silent package:deb:path)
          mkdir -p ubuntu-package
          node tools/check-linux-abi.mjs "$package" > ubuntu-package/abi-build.json
          cp -- "$package" ubuntu-package/
          (cd ubuntu-package && sha256sum -- *.deb > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: ubuntu-package/*
          if-no-files-found: error
          retention-days: 14
      - name: Run packaged WebKitGTK acceptance
        run: pnpm nx run "desktop:native-${NATIVE_SUITE}" --output-style=static
      - name: Run packaged GitLab catalogue acceptance
        run: |
          package=$(task --silent package:deb:path)
          pnpm nx exec -p desktop --excludeTaskDependencies -- \
            python3 "$PWD/tools/native_acceptance.py" --suite gitlab --headless --package "$package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-native-${{ env.NATIVE_SUITE }}-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.path }}
            test-results/native/
          if-no-files-found: error
          retention-days: 14

  linux-runtime:
    name: Ubuntu and Debian exact-artifact acceptance
    needs: packaged-native
    uses: ./.github/workflows/linux-package-acceptance.yml
    with:
      artifact-name: ubuntu-package
      ref: ${{ github.sha }}
