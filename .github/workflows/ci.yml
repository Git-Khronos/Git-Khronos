name: Desktop CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      native-suite:
        description: Packaged native suite
        required: true
        default: full
        type: choice
        options:
          - full
          - performance

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_DAEMON: "false"
  NX_ISOLATE_PLUGINS: "false"

jobs:
  windows-repository-files:
    name: Windows repository file boundaries
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NX_DAEMON: "false"
      NX_ISOLATE_PLUGINS: "false"
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-repository-files-v1
      - run: pnpm install --frozen-lockfile
      - name: Verify repository file boundaries on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core repository_files::tests -- --nocapture
      - name: Verify working-file previews on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core file_content::tests -- --nocapture
      - name: Verify ignore-rule scope on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core untracks_only_the_selected_file_and_preserves_other_changes -- --nocapture
      - name: Verify ignore-file safety on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core tests::ignore_ -- --nocapture
      - name: Verify discard path boundaries on Windows
        run: pnpm exec nx exec -p desktop --excludeTaskDependencies -- cargo test -p git-khronos-git-core discard_refuses_a_parent_symlink_swapped_after_review -- --nocapture

  linux-checks:
    name: Linux TypeScript, Rust and harness checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: checks-line-tables-v1
      - name: Install Linux build prerequisites
        run: |
          set -euo pipefail
          # None of these dependencies come from runner-vendor repositories.
          # Keep Ubuntu's configured mirrors and signed security updates.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          test -s "$sources"
          apt_sources=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_sources[@]}" install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf git-lfs openssh-client gnupg gpgsm openssl libssl-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Check production renderer budgets
        run: pnpm nx run desktop:build:production --output-style=static
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('dist/apps/desktop/initial-renderer.json') != '' }}
        with:
          name: initial-renderer-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: dist/apps/desktop/initial-renderer.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify generated IPC, TypeScript, Rust, and harness tests
        run: |
          mkdir -p "$RUNNER_TEMP/git-khronos-tests"
          df -h . "$RUNNER_TEMP"
          pnpm nx run-many -t check -p contracts desktop --output-style=static
          TMPDIR="$RUNNER_TEMP/git-khronos-tests" pnpm nx run desktop:test --output-style=static
          TMPDIR="$RUNNER_TEMP/git-khronos-tests" pnpm nx run desktop:test-lfs --output-style=static
          TMPDIR=/tmp pnpm nx run desktop:test-signing --output-style=static
          pnpm nx run desktop:native-harness-test --output-style=static
          pnpm nx run desktop:archive-cache-test --output-style=static
      - name: Verify large nested discard and byte-for-byte recovery
        run: >-
          TMPDIR="$RUNNER_TEMP/git-khronos-tests"
          pnpm exec nx exec -p desktop --excludeTaskDependencies --
          cargo test -p git-khronos-git-core --lib discard_large_nested_untracked_batch_and_recover_exact_bytes
          -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: checks-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  renderer:
    name: Renderer acceptance (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Chromium can launch before loading renderer tests
        run: node tools/check-renderer-browser.mjs chromium
      - name: Run the renderer acceptance shard
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          GIT_KHRONOS_RENDERER_OUTPUT_DIR: test-results/renderer/shard-${{ matrix.shard }}
          GIT_KHRONOS_RENDERER_REPORT_DIR: test-results/renderer-report/shard-${{ matrix.shard }}
          GIT_KHRONOS_RENDERER_PROGRESS_FILE: test-results/renderer-progress/shard-${{ matrix.shard }}.json
        run: |
          set -euo pipefail
          mkdir -p -- "$(dirname -- "$GIT_KHRONOS_RENDERER_PROGRESS_FILE")"
          plan="$(mktemp -d "$RUNNER_TEMP/renderer-shard.XXXXXX")"
          pnpm exec playwright test --list --reporter=line > "$plan/all"
          node tools/plan-renderer-shard.mjs "$plan/all" "$SHARD" "$SHARD_TOTAL" > "$plan/selected"
          pnpm exec playwright test --list --reporter=line --test-list "$plan/selected" > "$plan/resolved"
          diff -u "$plan/selected" <(sed -n '/^  \[chromium\] › /p' "$plan/resolved")
          pnpm nx run desktop:e2e --output-style=static --skipNxCache -- \
            --test-list "$plan/selected" --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: renderer-progress-${{ github.run_id }}-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/renderer-progress/shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: renderer-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  checks:
    # Preserve the existing check name even when callers require it in rulesets.
    name: Checks and renderer acceptance
    needs: [linux-checks, renderer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful checks and all Chromium shards
        env:
          CHECKS_RESULT: ${{ needs.linux-checks.result }}
          RENDERER_RESULT: ${{ needs.renderer.result }}
        run: |
          printf 'Linux checks: %s\nRenderer matrix: %s\n' "$CHECKS_RESULT" "$RENDERER_RESULT"
          test "$CHECKS_RESULT" = success && test "$RENDERER_RESULT" = success

  packaged-build:
    name: Build and verify Jammy package
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/jammy-git
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: packaged-jammy-v1
      - uses: go-task/setup-task@v1
      - name: Install Linux package prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf git-lfs openssh-client gnupg gpgsm fakeroot desktop-file-utils libglib2.0-bin openssl libssl-dev pkg-config dbus
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/debian-package-regressions
      - name: Prefetch locked Cargo metadata for offline package notices
        run: cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > /dev/null
      - name: Build and verify Debian package
        run: pnpm nx run desktop:package-ubuntu --output-style=static
      - name: Gate the release ABI and capture one immutable runtime-test artifact
        run: |
          package=$(task --silent package:deb:path)
          mkdir -p ubuntu-package
          node tools/check-linux-abi.mjs "$package" > ubuntu-package/abi-build.json
          cp -- "$package" ubuntu-package/
          (cd ubuntu-package && sha256sum -- *.deb > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: ubuntu-package/*
          if-no-files-found: error
          retention-days: 14

  packaged-native:
    name: Jammy package and native acceptance
    needs: packaged-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NATIVE_SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || (github.event_name == 'workflow_dispatch' && inputs['native-suite'] || 'full') }}
    steps:
      - name: Require a successful package build
        env:
          BUILD_RESULT: ${{ needs.packaged-build.result }}
        run: |
          if [[ "$BUILD_RESULT" != success ]]; then
            echo "::error::The Jammy package build did not succeed ($BUILD_RESULT)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: ./.github/actions/jammy-git
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: Install WebDriver and native acceptance prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes webkit2gtk-driver xvfb xauth libxtst6 git-lfs openssh-client openssh-server gnupg gpgsm fakeroot desktop-file-utils libglib2.0-bin libayatana-appindicator3-1 librsvg2-2 openssl libssl-dev pkg-config dbus
          for tool in WebKitWebDriver dbus-daemon dbus-send dbus-run-session; do
            command -v "$tool"
          done
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Tauri WebDriver bridge
        run: cargo install tauri-driver --locked --version 2.0.6
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-package
          path: ubuntu-package
      - name: Verify the exact package before native acceptance
        id: verify-native-package
        run: |
          set -euo pipefail
          cd ubuntu-package
          shopt -s nullglob
          packages=(Git-Khronos_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          expected=$(sha256sum -- "${packages[0]}")
          test "$(cat SHA256SUMS)" = "$expected"
          echo "PACKAGE=$PWD/${packages[0]}" >> "$GITHUB_ENV"
      - name: Run packaged WebKitGTK acceptance
        run: pnpm nx run "desktop:native-${NATIVE_SUITE}" --output-style=static -- --package "$PACKAGE"
      - name: Run focused packaged signing and tag-navigation acceptance
        run: |
          pnpm nx run desktop:native-signed-commit --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-empty-commit --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-merge-preview --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-signed-tag --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-lfs-lock-actions --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-tag-preview --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-file-history --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-conflict-navigation --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-file-tools --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-working-tree-recaps --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-discard-busy --output-style=static -- --package "$PACKAGE"
          pnpm nx run desktop:native-integrity-ui --output-style=static -- --package "$PACKAGE"
      - name: Run focused packaged GitLab fork navigation acceptance
        run: |
          pnpm nx exec -p desktop --excludeTaskDependencies -- \
            python3 "$PWD/tools/native_acceptance.py" --suite gitlab-fork-ui --headless --package "$PACKAGE"
      - name: Run packaged GitLab catalogue acceptance
        run: |
          pnpm nx exec -p desktop --excludeTaskDependencies -- \
            python3 "$PWD/tools/native_acceptance.py" --suite gitlab --headless --package "$PACKAGE"
      - name: Upload packaged acceptance diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.verify-native-package.outcome == 'success' }}
        with:
          name: packaged-native-${{ env.NATIVE_SUITE }}-${{ github.run_id }}
          path: test-results/native/
          if-no-files-found: error
          retention-days: 14

  linux-runtime:
    name: Ubuntu and Debian exact-artifact acceptance
    needs: packaged-build
    uses: ./.github/workflows/linux-package-acceptance.yml
    with:
      artifact-name: ubuntu-package
      ref: ${{ github.sha }}
