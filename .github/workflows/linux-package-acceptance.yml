name: Exact-artifact Linux acceptance

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
      ref:
        type: string
        required: true
      expect-update-trust:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runtime:
    name: Installed package on Ubuntu ${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ubuntu-package
      - name: Verify the build job's exact artifact checksums
        working-directory: ubuntu-package
        run: sha256sum --check SHA256SUMS
      - uses: ./.github/actions/jammy-git
        if: matrix.ubuntu == '22.04'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ubuntu-runtime-${{ matrix.ubuntu }}
      - name: Install runtime acceptance prerequisites
        env:
          UBUNTU_RELEASE: ${{ matrix.ubuntu }}
        run: |
          set -euo pipefail
          case "$UBUNTU_RELEASE" in
            22.04|24.04) webdriver_package=webkit2gtk-driver ;;
            26.04) webdriver_package=webkitgtk-webdriver ;;
            *) echo "Unsupported Ubuntu release: $UBUNTU_RELEASE" >&2; exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install --yes "$webdriver_package" libwebkit2gtk-4.1-0 xvfb libxtst6 git-lfs openssh-client openssh-server desktop-file-utils libglib2.0-bin openssl dbus libssl-dev pkg-config
          sudo install -d -m 1777 /tmp/.X11-unix
          for tool in WebKitWebDriver dbus-daemon dbus-send dbus-run-session; do
            command -v "$tool"
          done
          dpkg-query -W "$webdriver_package" libwebkit2gtk-4.1-0
          if [[ "$(dpkg-query -W -f='${Version}' "$webdriver_package")" != "$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)" ]]; then
            echo "WebKitWebDriver and WebKitGTK runtime versions differ." >&2
            exit 1
          fi
          cargo install tauri-driver --locked --version 2.0.6
      - name: Check Jammy ABI and install the unchanged Debian package
        run: |
          set -euo pipefail
          packages=(ubuntu-package/Git-Khronos_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          package="$PWD/${packages[0]}"
          node tools/check-linux-abi.mjs "$package" > ubuntu-package/abi-runtime.json
          sudo apt-get install --yes --no-remove "$package"
          dpkg-query -W git-khronos git libc6 libwebkit2gtk-4.1-0
          sudo apt-get check
          printf 'PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"
      - name: Exercise the installed executable with isolated repositories and profile
        run: |
          python3 tools/native_acceptance.py --suite smoke --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite gitlab --headless --installed --package "$PACKAGE"
      - name: Verify installed workspace and Git workflow reviews
        if: matrix.ubuntu == '24.04'
        run: |
          python3 tools/native_acceptance.py --suite workspace-batch --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite workspace-pull-upstreams --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite pull-submodule-scope --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite workspace-saved-removal --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite workspace-locate --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite workspace-bulk-locate --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite workspace-locate-nearby --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite workspace-reopen --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite discard-subset --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite submodule-initialize --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite submodule-update --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite stash-selection --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite patch-export --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite tracked-file-search --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite feature-rebase --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite commit-rewrite --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite file-review-scope --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite repository-creation-scope --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite first-status --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite working-tree-recaps --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite repository-open-scope --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite detached-checkout --headless --installed --package "$PACKAGE"
          python3 tools/native_acceptance.py --suite checkout-snapshot --headless --installed --package "$PACKAGE"
      - name: Verify installed packed-ref refresh under contention
        if: inputs.expect-update-trust && matrix.ubuntu == '22.04'
        run: python3 tools/native_acceptance.py --suite watcher-refresh --headless --installed --package "$PACKAGE"
      - name: Provision JSON-capable Git LFS for full Jammy qualification
        if: inputs.expect-update-trust && matrix.ubuntu == '22.04'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = x86_64
          # Stock Jammy Git LFS 3.0.2 remains in use for the smoke checks above.
          # The full suite exercises optional diagnostics that require ls-files --json.
          version=3.7.1
          archive="git-lfs-linux-amd64-v${version}.tar.gz"
          sha256=1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08
          bin="$(mktemp -d "$RUNNER_TEMP/qualification-lfs.XXXXXXXX")"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/git-lfs/git-lfs/releases/download/v${version}/${archive}" \
            --output "$bin/$archive"
          printf '%s  %s\n' "$sha256" "$bin/$archive" | sha256sum --check --strict
          tar -xOzf "$bin/$archive" "git-lfs-${version}/git-lfs" > "$bin/git-lfs"
          chmod 0755 "$bin/git-lfs"
          rm "$bin/$archive"
          installed_version="$(PATH="$bin:$PATH" git lfs version)"
          printf '%s\n' "$installed_version"
          [[ "$installed_version" == "git-lfs/$version "* ]]
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
      - name: Exercise Git LFS snapshots on the exact installed Jammy candidate
        if: inputs.expect-update-trust && matrix.ubuntu == '22.04'
        shell: bash
        run: |
          set -euo pipefail
          for suite in lfs-counts lfs-snapshot-timeout; do
            python3 tools/native_acceptance.py --suite "$suite" --headless --installed --package "$PACKAGE"
          done
      - name: Qualify publisher trust on the exact installed Jammy candidate
        if: inputs.expect-update-trust && matrix.ubuntu == '22.04'
        env:
          GIT_KHRONOS_NATIVE_EXPECT_UPDATE_TRUST: "1"
        run: |
          python3 tools/native_acceptance.py --suite environment --headless --installed \
            --package "$PACKAGE" --output test-results/native/release-qualification
          reports=(test-results/native/release-qualification/environment-*/report.json)
          test "${#reports[@]}" -eq 1
          cp -- "${reports[0]}" test-results/native/release-qualification/report.json
      - uses: actions/upload-artifact@v4
        if: inputs.expect-update-trust && matrix.ubuntu == '22.04'
        with:
          name: debian-candidate-evidence-${{ github.run_attempt }}
          path: test-results/native/release-qualification/report.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-${{ matrix.ubuntu }}-runtime-${{ github.run_id }}
          path: |
            test-results/native/
            ubuntu-package/abi-runtime.json
          if-no-files-found: warn
          retention-days: 14

  debian-runtime:
    name: Installed package on Debian ${{ matrix.debian }}
    runs-on: ubuntu-24.04
    container:
      image: debian:${{ matrix.debian }}-slim
    strategy:
      fail-fast: true
      matrix:
        debian: ["12", "13"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ubuntu-package
      - name: Verify the build job's exact artifact checksums
        working-directory: ubuntu-package
        run: sha256sum --check SHA256SUMS
      - name: Bootstrap tools for Debian container actions
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes ca-certificates curl gcc git libc6-dev tar xz-utils
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: debian-runtime-${{ matrix.debian }}
      - name: Install Debian runtime acceptance prerequisites
        env:
          DEBIAN_RELEASE: ${{ matrix.debian }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEBIAN_RELEASE" in
            12) webdriver_package=webkit2gtk-driver ;;
            13) webdriver_package=webkitgtk-webdriver ;;
            *) echo "Unsupported Debian release: $DEBIAN_RELEASE" >&2; exit 1 ;;
          esac
          test "$(dpkg --print-architecture)" = amd64
          apt-get update
          apt-get install --yes \
            "$webdriver_package" libwebkit2gtk-4.1-0 xvfb libxtst6 git git-lfs \
            openssh-client openssh-server desktop-file-utils libglib2.0-bin \
            openssl dbus-daemon dbus-bin libssl-dev pkg-config python3 binutils
          install -d -m 0755 /run/sshd
          install -d -m 1777 /tmp/.X11-unix
          for tool in WebKitWebDriver dbus-daemon dbus-send dbus-run-session; do
            command -v "$tool"
          done
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          dpkg-query -W "$webdriver_package" libwebkit2gtk-4.1-0
          if [[ "$(dpkg-query -W -f='${Version}' "$webdriver_package")" != "$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)" ]]; then
            echo "WebKitWebDriver and WebKitGTK runtime versions differ." >&2
            exit 1
          fi
          for tool in cargo rustup; do
            command -v "$tool"
          done
          cargo install tauri-driver --locked --version 2.0.6
      - name: Check Jammy ABI and install the unchanged Debian package
        shell: bash
        run: |
          set -euo pipefail
          packages=(ubuntu-package/Git-Khronos_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          package="$PWD/${packages[0]}"
          node tools/check-linux-abi.mjs "$package" > ubuntu-package/abi-runtime.json
          apt-get install --yes --no-remove "$package"
          dpkg-query -W git-khronos git libc6 libwebkit2gtk-4.1-0
          apt-get check
          printf 'PACKAGE=%s\n' "$package" >> "$GITHUB_ENV"
      - name: Exercise the installed executable with isolated repositories and profile
        shell: bash
        env:
          DEBIAN_RELEASE: ${{ matrix.debian }}
        run: |
          if [[ "$DEBIAN_RELEASE" == 12 ]]; then
            # Includes the normal smoke checks. Exercise cold saved-tab restore
            # on the oldest supported Git family, not only on upgraded Jammy Git.
            python3 tools/native_acceptance.py --suite incoming-links --inherited-git-environment \
              --headless --installed --package "$PACKAGE"
          else
            python3 tools/native_acceptance.py --suite smoke --headless --installed --package "$PACKAGE"
          fi
          python3 tools/native_acceptance.py --suite gitlab --headless --installed --package "$PACKAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-${{ matrix.debian }}-runtime-${{ github.run_id }}
          path: |
            test-results/native/**
            ubuntu-package/abi-runtime.json
          if-no-files-found: warn
          retention-days: 14
