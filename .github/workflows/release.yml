name: Qualify Debian release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable version tag on main to build and qualify
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  debian:
    name: Build Ubuntu package on Jammy
    if: github.ref == 'refs/heads/main' && github.repository == 'Git-Khronos/Git-Khronos'
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check release publisher configuration
        env:
          GIT_KHRONOS_UPDATER_PUBLIC_KEY: ${{ vars.GIT_KHRONOS_UPDATER_PUBLIC_KEY }}
        run: |
          if [[ ! "$GIT_KHRONOS_UPDATER_PUBLIC_KEY" =~ [^[:space:]] ]]; then
            echo "::error::Set the GIT_KHRONOS_UPDATER_PUBLIC_KEY Actions variable to the production public key before qualifying a release."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the tagged commit
        id: tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$release_commit" HEAD
          git checkout --detach "$release_commit"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/jammy-git
      - uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify updater public key format before candidate work
        env:
          GIT_KHRONOS_UPDATER_PUBLIC_KEY: ${{ vars.GIT_KHRONOS_UPDATER_PUBLIC_KEY }}
        run: node tools/check-debian-update-evidence.mjs --check-publisher-key
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: go-task/setup-task@v2
      - name: Check release tag matches installer and runtime versions
        run: bash tools/check-debian-release-version.sh "$RELEASE_TAG"
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf git-lfs openssh-client gnupg gpgsm openssl libssl-dev pkg-config fakeroot dbus
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/debian-package-regressions
      - name: Prefetch locked Cargo metadata for offline package notices
        run: cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > /dev/null
      - name: Build Debian package with pinned publisher trust
        env:
          GIT_KHRONOS_UPDATER_PUBLIC_KEY: ${{ vars.GIT_KHRONOS_UPDATER_PUBLIC_KEY }}
        run: |
          # Match the offline verifier's shell newline normalization.
          GIT_KHRONOS_UPDATER_PUBLIC_KEY="$(printf '%s' "$GIT_KHRONOS_UPDATER_PUBLIC_KEY")"
          export GIT_KHRONOS_UPDATER_PUBLIC_KEY
          pnpm nx run desktop:package-ubuntu --output-style=static
          package="$(task --silent package:deb:path)"
          mkdir -p test-results
          node tools/check-linux-abi.mjs "$package" > test-results/ubuntu-abi-build.json
      - name: Retain measured build diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: debian-build-diagnostics-${{ github.run_attempt }}
          path: |
            dist/apps/desktop/initial-renderer.json
            test-results/ubuntu-abi-build.json
          if-no-files-found: error
      - name: Install checksum-verified Syft
        run: |
          version=1.57.1
          asset="syft_${version}_linux_amd64.tar.gz"
          url="https://github.com/anchore/syft/releases/download/v${version}"
          mkdir -p "$RUNNER_TEMP/syft"
          curl --fail --silent --show-error --location "$url/$asset" --output "$RUNNER_TEMP/syft/$asset"
          curl --fail --silent --show-error --location "$url/syft_${version}_checksums.txt" \
            --output "$RUNNER_TEMP/syft/checksums.txt"
          awk -v asset="$asset" '$2 == asset || $2 == "*" asset' "$RUNNER_TEMP/syft/checksums.txt" \
            > "$RUNNER_TEMP/syft/asset.sha256"
          test "$(wc -l < "$RUNNER_TEMP/syft/asset.sha256")" -eq 1
          (cd "$RUNNER_TEMP/syft" && sha256sum --check --status asset.sha256)
          tar -xzf "$RUNNER_TEMP/syft/$asset" -C "$RUNNER_TEMP/syft" syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"
      - name: Prepare release package and checksum
        run: |
          package="$(task --silent package:deb:path)"
          version="${RELEASE_TAG#v}"
          asset="$(basename "$package")"
          test "$(dpkg-deb -f "$package" Package)" = git-khronos
          test "$(dpkg-deb -f "$package" Version)" = "$version"
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          mkdir -p release-assets
          test "$asset" = "Git-Khronos_${version}_amd64.deb"
          cp -- "$package" release-assets/
          cp -- "${CARGO_TARGET_DIR:-target}/release/.git-khronos-package-build.v1.json" \
            release-assets/build-receipt.json
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" --arg tag "$RELEASE_TAG" \
            --arg commit "$(git rev-parse HEAD)" --arg runId "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema: 1, $repository, $tag, $commit, $runId, $attempt}' \
            > release-assets/candidate.json
          syft scan "file:$PWD/release-assets/$asset" \
            -o "cyclonedx-json=$PWD/release-assets/${asset%.deb}.cdx.json"
          syft scan "dir:$GITHUB_WORKSPACE" \
            --source-name "Git Khronos source dependencies" \
            --source-version "$version" \
            --exclude '**/node_modules/**' \
            --exclude '**/target/**' \
            --exclude '**/dist/**' \
            --exclude '**/release-assets/**' \
            --exclude '**/.git/**' \
            -o "cyclonedx-json=$PWD/release-assets/Git-Khronos_${version}_source.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and (.components | type == "array")' \
            "release-assets/${asset%.deb}.cdx.json" >/dev/null
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            "release-assets/Git-Khronos_${version}_source.cdx.json" >/dev/null
          (
            cd release-assets
            sha256sum -- "$asset" "${asset%.deb}.cdx.json" \
              "Git-Khronos_${version}_source.cdx.json" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - uses: actions/upload-artifact@v6
        with:
          name: debian-candidate-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  linux-runtime:
    name: Qualify the exact release package
    needs: debian
    uses: ./.github/workflows/linux-package-acceptance.yml
    with:
      artifact-name: debian-candidate-${{ github.run_attempt }}
      ref: ${{ needs.debian.outputs.commit }}
      expect-update-trust: true
