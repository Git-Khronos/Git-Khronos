name: Publish signed Debian release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag used by the successful candidate run
        required: true
        type: string
      candidate_run_id:
        description: Successful Qualify Debian release candidate run ID
        required: true
        type: string
      signature:
        description: Public .deb.sig content, NEVER the private key or passphrase
        required: true
        type: string

permissions: {}

concurrency:
  group: signed-debian-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  verify:
    name: Validate candidate evidence and signed assets
    if: github.ref == 'refs/heads/main' && github.repository == 'Git-Khronos/Git-Khronos'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    outputs:
      tag-commit: ${{ steps.candidate.outputs.commit }}
      artifact-id: ${{ steps.assets.outputs.artifact-id }}
      checksums-sha256: ${{ steps.prepare.outputs.checksums_sha256 }}
    steps:
      - name: Require a reviewer-protected main-only release environment before publication
        if: vars.GIT_KHRONOS_SIGNED_PUBLICATION_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment="repos/$GITHUB_REPOSITORY/environments/signed-release"
          policy="$(gh api "$environment")" || policy=""
          if ! jq -se 'length == 1 and (.[0] | .name == "signed-release" and any(.protection_rules[]?;
              .type == "required_reviewers" and (.reviewers | type == "array" and length > 0)))' >/dev/null <<< "$policy"; then
            echo '::error::Configure at least one required reviewer on the signed-release environment before enabling publication.'
            exit 1
          fi
          if ! jq -se 'length == 1 and (.[0].deployment_branch_policy |
              .custom_branch_policies == true and .protected_branches == false)' >/dev/null <<< "$policy" ||
             ! gh api "$environment/deployment-branch-policies?per_page=2" |
               jq -se 'length == 1 and (.[0] | .total_count == 1 and (.branch_policies | length == 1) and
                 .branch_policies[0].name == "main" and .branch_policies[0].type == "branch")' >/dev/null; then
            echo '::error::Restrict the signed-release environment to exactly one branch policy for main and no tag rules.'
            exit 1
          fi
      - name: Check publisher key and signature inputs
        env:
          PUBLIC_KEY: ${{ vars.GIT_KHRONOS_UPDATER_PUBLIC_KEY }}
          PACKAGE_SIGNATURE: ${{ inputs.signature }}
        run: |
          set -euo pipefail
          if [[ ! "$PUBLIC_KEY" =~ [^[:space:]] ]]; then
            echo "::error::Set the GIT_KHRONOS_UPDATER_PUBLIC_KEY Actions variable to the production public key."
            exit 1
          fi
          if [[ ! "$PACKAGE_SIGNATURE" =~ [^[:space:]] ]]; then
            echo "::error::Supply the public .deb.sig content for the qualified package."
            exit 1
          fi
          umask 077
          printf '%s' "$PUBLIC_KEY" > "$RUNNER_TEMP/publisher.pub"
          printf '%s' "$PACKAGE_SIGNATURE" > "$RUNNER_TEMP/package.sig"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify updater public key format before candidate work
        env:
          GIT_KHRONOS_UPDATER_PUBLIC_KEY: ${{ vars.GIT_KHRONOS_UPDATER_PUBLIC_KEY }}
        run: node tools/check-debian-update-evidence.mjs --check-publisher-key
      - name: Resolve the successful candidate workflow attempt
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$commit" HEAD
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          selection="$(node tools/check-debian-candidate-run.mjs "$RUNNER_TEMP/candidate-run.json" "$RUN_ID")"
          read -r attempt_head attempt <<< "$selection"
          git merge-base --is-ancestor "$attempt_head" HEAD
          git merge-base --is-ancestor "$commit" "$attempt_head"
          printf 'attempt=%s\ncommit=%s\n' "$attempt" "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          name: debian-candidate-${{ steps.candidate.outputs.attempt }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          name: debian-candidate-evidence-${{ steps.candidate.outputs.attempt }}
          path: candidate-evidence
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: debian-runtime-reports-${{ steps.candidate.outputs.attempt }}-*
          path: candidate-matrix
      - name: Match candidate to the requested tag commit
        env:
          RUN_ID: ${{ inputs.candidate_run_id }}
          TAG_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: |
          node tools/check-debian-candidate-run.mjs "$RUNNER_TEMP/candidate-run.json" \
            "$RUN_ID" candidate/candidate.json "$RELEASE_TAG" "$TAG_COMMIT"
      - name: Verify the installed release matrix for the exact candidate
        run: |
          set -euo pipefail
          node tools/report-installed-acceptance.mjs --verify-release \
            candidate/build-receipt.json "$RUNNER_TEMP/publisher.pub" \
            "candidate/Git-Khronos_${RELEASE_TAG#v}_amd64.deb" --reports-dir candidate-matrix \
            > "$RUNNER_TEMP/installed-release-matrix.json"
      - name: Bind the candidate digest to its qualification evidence
        id: qualified-bytes
        run: |
          set -euo pipefail
          checksum="$(node tools/check-debian-update-evidence.mjs --release-package \
            "candidate/Git-Khronos_${RELEASE_TAG#v}_amd64.deb" candidate/build-receipt.json \
            candidate-evidence/report.json "$RUNNER_TEMP/publisher.pub")"
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          printf 'sha256=%s\n' "$checksum" >> "$GITHUB_OUTPUT"
      - name: Retain the verified matrix for release reviewers
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-matrix-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-release-matrix.json
          if-no-files-found: error
          retention-days: 7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - name: Install verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run desktop:build --output-style=static
      - name: Prepare and reverify exactly the assets to upload
        id: prepare
        run: |
          set -euo pipefail
          output="$(mktemp -d)"
          directory="$(bash tools/prepare-signed-debian-release.sh candidate candidate-evidence/report.json \
            "$RUNNER_TEMP/publisher.pub" "$RUNNER_TEMP/package.sig" "$RELEASE_TAG" "$output")"
          checksum="$(sha256sum -- "$directory/SHA256SUMS")"
          printf 'directory=%s\nchecksums_sha256=%s\n' "$directory" "${checksum%% *}" >> "$GITHUB_OUTPUT"
      - name: Rehearse the staged update with the updater library
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_KHRONOS_STAGED_RELEASE_DIR: ${{ steps.prepare.outputs.directory }}
          GIT_KHRONOS_QUALIFIED_PACKAGE_SHA256: ${{ steps.qualified-bytes.outputs.sha256 }}
        run: |
          set -euo pipefail
          baseline="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$baseline" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          dpkg --compare-versions "${RELEASE_TAG#v}" gt "${baseline#v}" || {
            echo "::error::The signed candidate must be newer than the current stable release."
            exit 1
          }
          GIT_KHRONOS_STAGED_PUBLIC_KEY="$RUNNER_TEMP/publisher.pub" \
          GIT_KHRONOS_STAGED_BASELINE_VERSION="${baseline#v}" \
            cargo test --locked -p git-khronos-desktop --example stage-debian-update \
            qualified_release_can_be_consumed_offline -- --ignored
      - name: Retain the verified public assets for the publish job
        uses: actions/upload-artifact@v4
        id: assets
        with:
          name: signed-debian-release-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.directory }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Summarize the verified release handoff
        env:
          TAG_COMMIT: ${{ steps.candidate.outputs.commit }}
          ASSET_ID: ${{ steps.assets.outputs.artifact-id }}
          CHECKSUMS_SHA256: ${{ steps.prepare.outputs.checksums_sha256 }}
          PUBLICATION_ENABLED: ${{ vars.GIT_KHRONOS_SIGNED_PUBLICATION_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          lanes="$(jq -er '.releaseMatrix | select(.complete == true) | .checks | length' "$RUNNER_TEMP/installed-release-matrix.json")"
          {
            printf '### Signed assets verified for %s\n\n' "$RELEASE_TAG"
            printf -- '- Tag commit: `%s`\n' "$TAG_COMMIT"
            printf -- '- Verified asset artifact ID: `%s`\n' "$ASSET_ID"
            printf -- '- Verified installed lanes: %s\n' "$lanes"
            printf -- '- SHA256SUMS digest: `%s`\n\n' "$CHECKSUMS_SHA256"
            if [[ "$PUBLICATION_ENABLED" == true ]]; then
              printf 'Verification does not publish a release. See the protected publish job for the publication result.\n'
            else
              printf 'Verification only: publication is disabled. No release will be created by this run.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish exact signed assets to GitHub Releases
    if: vars.GIT_KHRONOS_SIGNED_PUBLICATION_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: signed-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, supports artifact-ids
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: release-assets
      - name: Verify tag and transferred assets, then publish
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ needs.verify.outputs.tag-commit }}
          CHECKSUMS_SHA256: ${{ needs.verify.outputs.checksums-sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$TAG_COMMIT" =~ ^[a-f0-9]{40}$ && "$CHECKSUMS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          version="${RELEASE_TAG#v}"
          deb="Git-Khronos_${version}_amd64.deb"
          assets=("$deb" "${deb%.deb}.cdx.json" "Git-Khronos_${version}_source.cdx.json" latest.json)
          for file in "${assets[@]}" SHA256SUMS; do
            test -f "$file" && test ! -L "$file" || exit 1
          done
          printf '%s  SHA256SUMS\n' "$CHECKSUMS_SHA256" | sha256sum --check --strict
          sha256sum -- "${assets[@]}" | cmp -- SHA256SUMS

          tag_ref="refs/tags/$RELEASE_TAG"
          refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$tag_ref" "$tag_ref^{}")"
          remote_commit="$(awk -v tag="$tag_ref" '$2==tag { object=$1 } $2==tag "^{}" { peeled=$1 }
            END { print (peeled ? peeled : object) }' <<< "$refs")"
          test "$remote_commit" = "$TAG_COMMIT" || {
            echo "Release tag no longer points at the verified commit." >&2
            exit 1
          }
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$latest" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          dpkg --compare-versions "$version" gt "${latest#v}" || {
            echo "Refusing to replace the latest release with the same or an older version." >&2
            exit 1
          }
          # Use the changelog shipped in the verified installer, not the
          # publication workflow's checkout or commit history.
          changelog="$RUNNER_TEMP/package-changelog"
          dpkg-deb --fsys-tarfile "$deb" |
            tar -xOf - ./usr/share/doc/git-khronos/changelog.gz |
            gzip -dc > "$changelog"
          test "$(dpkg-parsechangelog --file "$changelog" --show-field Version)" = "$version"
          notes="$RUNNER_TEMP/release-notes.md"
          printf '## What changed\n\n' > "$notes"
          dpkg-parsechangelog --file "$changelog" --show-field Changes |
            awk '
              /^  \* / { sub(/^  \* /, "- "); print; found = 1; next }
              found && /^    / { sub(/^    /, "  "); print }
              END { if (!found) exit 1 }
            ' >> "$notes"
          printf '\n## Linux package\n\n%s\n' \
            "Publisher-signed amd64 Debian package built on Ubuntu 22.04 and tested unchanged on Ubuntu 22.04, 24.04 and 26.04 and Debian 12 and 13. Git 2.39 or newer is required; stock Ubuntu 22.04 Git is insufficient. Neither the installer nor the package adds APT repositories. Includes the signed updater manifest, CycloneDX inventories, and SHA256SUMS." >> "$notes"
          printf '\n## Updates\n\n%s\n' \
            "If your installed version does not include this publisher key, download and install the Debian package once using your system package manager. A release manifest cannot add trust to an older installation. After installing a trusted build, use the Updates menu to check manually or opt in to automatic updates." >> "$notes"
          # A missing environment can be recreated without protection.
          # Recheck immediately before the only repository write.
          environment="repos/$GITHUB_REPOSITORY/environments/signed-release"
          policy="$(gh api "$environment")" || policy=""
          if ! jq -se 'length == 1 and (.[0] | .name == "signed-release" and any(.protection_rules[]?;
              .type == "required_reviewers" and (.reviewers | type == "array" and length > 0)))' >/dev/null <<< "$policy"; then
            echo '::error::Configure at least one required reviewer on the signed-release environment before enabling publication.'
            exit 1
          fi
          if ! jq -se 'length == 1 and (.[0].deployment_branch_policy |
              .custom_branch_policies == true and .protected_branches == false)' >/dev/null <<< "$policy" ||
             ! gh api "$environment/deployment-branch-policies?per_page=2" |
               jq -se 'length == 1 and (.[0] | .total_count == 1 and (.branch_policies | length == 1) and
                 .branch_policies[0].name == "main" and .branch_policies[0].type == "branch")' >/dev/null; then
            echo '::error::Restrict the signed-release environment to exactly one branch policy for main and no tag rules.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Git Khronos ${version}" \
            --notes-file "$notes"
